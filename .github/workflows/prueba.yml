# Rehace la pagina (https://mvila9700.github.io/escalera/) con la ultima escalera que haya. Gratis.
name: Actualizar pagina
on: workflow_dispatch
concurrency: escalera
permissions:
  contents: write
jobs:
  pagina:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          TZ: Europe/Madrid
        run: python -m tareas.publicar_hoy
      - run: |
          git config user.name "escalera-bot"; git config user.email "escalera-bot@users.noreply.github.com"
          git add -A HOY_*.txt docs
          git diff --cached --quiet || (git commit -m "Pagina actualizada" && git push)
