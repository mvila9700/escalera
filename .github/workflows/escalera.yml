# Escalera diaria (NQ y ES) con Databento, sin el Mac.
# De lunes a viernes, cada 20 minutos entre las 07:00 y las 15:40 de Madrid (06-14 UTC en invierno).
# Si la escalera de hoy ya esta, termina en segundos. Si Databento aun no tiene los datos, lo
# intenta en la siguiente pasada. Resultado: la pagina https://mvila9700.github.io/escalera/
name: Escalera diaria
on:
  schedule:
    - cron: "*/20 6-14 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Rehacerla aunque ya exista (si/no)"
        default: "no"
concurrency: escalera
permissions:
  contents: write
jobs:
  escalera:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ya esta la de hoy?
        id: hoy
        run: |
          H=$(TZ=Europe/Madrid date +%F)
          echo "fecha=$H" >> $GITHUB_OUTPUT
          if [ -f datos/historico/$H.json ] && [ -f datos/historico/ES_$H.json ] && [ "${{ github.event.inputs.forzar }}" != "si" ]; then
            echo "hecha=1" >> $GITHUB_OUTPUT; echo "Ya estan las escaleras del $H."
          fi
      - uses: actions/setup-python@v5
        if: steps.hoy.outputs.hecha != '1'
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar
        if: steps.hoy.outputs.hecha != '1'
        run: pip install -r requirements.txt
      - name: Datos de Databento ya descargados (cache)
        if: steps.hoy.outputs.hecha != '1'
        uses: actions/cache@v4
        with:
          path: datos/oi/*.dbn.zst
          key: oi-${{ github.run_id }}
          restore-keys: oi-
      - name: Generar
        if: steps.hoy.outputs.hecha != '1'
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          TZ: Europe/Madrid
        run: |
          F=""; [ "${{ github.event.inputs.forzar }}" = "si" ] && F="--forzar"
          python -m tareas.escalera_databento --no-esperar --no-abrir $F || echo "Aun no (se reintenta en la siguiente pasada)"
          tail -n 15 datos/registro.log || true
          python -m tareas.publicar_hoy
          find datos/oi -name "*.dbn.zst" -mtime +10 -delete || true
      - name: Guardar
        if: steps.hoy.outputs.hecha != '1'
        run: |
          git config user.name "escalera-bot"; git config user.email "escalera-bot@users.noreply.github.com"
          git add -A datos/historico datos/oi/gasto_databento.json HOY_*.txt docs || true
          git diff --cached --quiet || (git commit -m "Escalera ${{ steps.hoy.outputs.fecha }}" && git push)
